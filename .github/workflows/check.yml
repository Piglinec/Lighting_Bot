name: Проверка графика

on:
  schedule:
    - cron: "*/5 * * * *"     # каждые 5 минут (чаще GitHub не позволяет)
  workflow_dispatch:           # ручной запуск: Actions → Проверка графика → Run workflow

# не запускать две проверки одновременно (иначе возможны дубли уведомлений)
concurrency:
  group: volyn-bot
  cancel-in-progress: false

permissions:
  contents: write              # чтобы сохранить state.json в ветку state

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Загрузить состояние из ветки state
        run: |
          if git fetch -q --depth=1 origin state 2>/dev/null; then
            git show origin/state:state.json > state.json || echo '{}' > state.json
          else
            echo '{}' > state.json
          fi

      - name: Проверить график и ответить на команды
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          DEFAULT_QUEUE: ${{ vars.DEFAULT_QUEUE }}
          ALLOWED_CHAT_IDS: ${{ secrets.ALLOWED_CHAT_IDS }}
          REMIND_BEFORE_MIN: ${{ vars.REMIND_BEFORE_MIN || '30' }}
          SEND_IMAGE: ${{ vars.SEND_IMAGE || '1' }}
          STATE_FILE: state.json
        run: python bot.py --once

      - name: Сохранить состояние (только если изменилось)
        if: always()
        run: |
          [ -s state.json ] || exit 0
          cp state.json /tmp/state.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify origin/state >/dev/null; then
            git worktree add -q /tmp/st origin/state
          else
            git worktree add -q --detach /tmp/st
            (cd /tmp/st && git checkout -q --orphan state && git rm -rfq . )
          fi
          cd /tmp/st
          cp /tmp/state.json state.json
          git add state.json
          if git diff --cached --quiet; then
            echo "состояние не изменилось"
          else
            git commit -qm "state $(date -u +%FT%TZ)"
            git push -q origin HEAD:state
          fi
